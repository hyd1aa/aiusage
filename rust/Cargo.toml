[package]
name = "aiusage-rs"
version = "0.2.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Behavior-compatible Rust implementation of AIUsage"
build = "build.rs"

[lib]
name = "aiusage"

[[bin]]
name = "aiusage"
path = "src/main.rs"

[[bin]]
name = "ai"
path = "src/ai.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
