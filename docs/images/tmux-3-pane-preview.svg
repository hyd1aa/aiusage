<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">tmux three-pane workflow with AIUsage</title>
  <desc id="desc">A large AI CLI pane on the left, a shell and logs pane at the upper right, and AIUsage at the lower right.</desc>
  <rect width="1200" height="630" rx="14" fill="#0d1117"/>
  <g fill="none" stroke="#8b949e" stroke-width="2">
    <rect x="20" y="20" width="1160" height="570" rx="4"/>
    <path d="M700 20v570M700 300h480"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">
    <text x="48" y="62" font-size="22" font-weight="700">PRIMARY AI CLI</text>
    <text x="48" y="108" font-size="18" fill="#8b949e">› Work with your primary assistant here</text>
    <text x="48" y="145" font-size="18" fill="#8b949e">› Keep the session running over SSH</text>
    <text x="728" y="62" font-size="22" font-weight="700">SHELL / LOGS</text>
    <text x="728" y="108" font-size="18" fill="#8b949e">$ watch application.log</text>
    <text x="728" y="145" font-size="18" fill="#3fb950">✓ service healthy</text>
    <text x="845" y="344" font-size="19" font-weight="700">──────── AI USAGE ────────</text>
    <text x="744" y="390" font-size="18" font-weight="700">CODEX</text>
    <text x="744" y="423" font-size="17">5h     ███████░░░  68% left</text>
    <text x="744" y="452" font-size="16" fill="#8b949e">Reset  Sep 04 02:50 UTC+08</text>
    <text x="744" y="493" font-size="18" font-weight="700">GROK</text>
    <text x="744" y="526" font-size="17">Week   █████░░░░░  51% left</text>
    <text x="744" y="555" font-size="16" fill="#8b949e">System 2026-09-04 01:42 UTC+08</text>
  </g>
  <rect x="0" y="598" width="1200" height="32" fill="#3fb950"/>
  <text x="18" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0d1117">work:1  tmux · AI CLI · AIUsage</text>
</svg>
