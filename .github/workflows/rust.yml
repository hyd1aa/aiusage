name: Rust parity

on:
  push:
    paths: ['rust/**', 'src/**', 'tests/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'src/**', 'tests/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Python behavior differs across supported versions for argparse
          # action ordering and ISO parsing. 3.10 is the documented migration
          # oracle; the normal Python CI still covers 3.10 through 3.13.
          python-version: '3.10'
      - name: Verify native architecture and install pinned toolchain
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.90.0 '${{ matrix.target }}'
      - name: Reference Python regression (unchanged)
        if: runner.os == 'Linux'
        working-directory: .
        run: PYTHONPATH=src python3 -m unittest discover -s tests -q
      - name: Rust and Python differential/PTY/lifecycle tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build self-contained application
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --release --bin aiusage --target '${{ matrix.target }}'
          binary='target/${{ matrix.target }}/release/aiusage'
          "$binary" --version
          "$binary" --demo --snapshot --size 80x24
          python3 tests/terminal_harness.py "$PWD/$binary"
          if [ '${{ runner.os }}' = 'Linux' ]; then
            ! readelf -d "$binary" | grep NEEDED
          else
            otool -L "$binary"
          fi
      - name: Upload build for review (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: aiusage-${{ matrix.platform }}
          path: rust/target/${{ matrix.target }}/release/aiusage
          if-no-files-found: error
