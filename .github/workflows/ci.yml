name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e '.[dev]'
      - name: Compile and import
        run: |
          python -m compileall -q src tests tools
          python -c "import aiusage; print(aiusage.__version__)"
          python -m tabnanny src tests tools
      - name: Offline unit and PTY tests
        env:
          NO_COLOR: "1"
        run: python -m unittest discover -s tests -v
      - name: Sensitive-pattern check
        run: python tools/check_sensitive.py

